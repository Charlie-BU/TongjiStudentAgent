root = "."
tmp_dir = ".air-tmp"

[build]
cmd = "go build -o ./.air-tmp/tongjistudent ."
bin = "./.air-tmp/tongjistudent"
full_bin = "bash ./local_run.sh --run-built"
include_ext = ["go"]
include_file = [".env", "go.mod", "go.sum", "local_run.sh"]
exclude_dir = [".git", ".bin", ".air-tmp", "vendor", "log", "output", "knowledge"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
# Keep development reloads quick while allowing shutdown hooks to run.
kill_delay = "2s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
